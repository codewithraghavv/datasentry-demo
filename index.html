<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataSentry | Silent Data Pipeline Failure Detection</title>
<meta name="description" content="Explore DataSentry, an interactive data quality demo that detects silent order loss, traces revenue errors and verifies recovery.">
<link rel="canonical" href="https://codewithraghavv.github.io/datasentry-demo/">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#242439;font:16px/1.55 system-ui,sans-serif}header,main{max-width:1040px;margin:auto;padding:1.3rem clamp(1rem,4vw,3rem)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9dcea}a{color:#4939ac}small{color:#565172;font-weight:650}h1{font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.07em;line-height:1;margin:.6rem 0}button{font:inherit;background:#4e40b7;color:white;padding:.7rem 1.1rem;border:0;border-radius:9px;cursor:pointer;font-weight:600}button:focus-visible,a:focus-visible{outline:3px solid #269779;outline-offset:3px}.panel{background:white;border:1px solid #dfe0ec;border-radius:16px;padding:1.25rem 1.5rem;margin-top:1rem}.number{font-weight:720;font-size:clamp(2.5rem,6vw,4.4rem);line-height:1.2;letter-spacing:-.06em}.bad{color:#a32740}.good{color:#146348}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}h2,h3,p{margin:.35rem 0 .8rem}h2{font-size:1.2rem}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eee;padding:.3rem}footer{padding:1.5rem 0}#action{margin:.65rem 0}.status{font-weight:650}@media(max-width:650px){.grid{grid-template-columns:1fr;gap:0}}
</style></head><body><header><strong>◈ &nbsp; DataSentry</strong><span>Interactive demo</span></header><main><small>DATA QUALITY &nbsp; / &nbsp; INCIDENT WORKSPACE</small><h1>Order pipeline health</h1><p>Detect a silent failure in a pipeline of 10,000 orders. Follow the revenue difference from cleaning to the executive dashboard.</p>
<button id="action" type="button">Simulate 25% order loss</button><section aria-live="polite" id="report"></section>
<footer><small>Guided replay of three recorded DataSentry pipeline runs.</small></footer></main>
<script src="demo-data.js"></script><script>
const money = value => value.toLocaleString('en-US',{style:'currency',currency:'USD'});
let state='healthy';
function render(){
 const run=runs[state], gap=runs.healthy.revenue-run.revenue, incident=state==='incident';
 document.getElementById('action').textContent=incident?'Restore and rerun':'Simulate 25% order loss';
 document.getElementById('report').innerHTML=`<p class="status"><span class="good">✓ Pipeline succeeded</span> &nbsp; · &nbsp; <span class="${run.healthy?'good':'bad'}">${run.healthy?'✓ Data quality passed':'× Data quality failed'}</span></p>
 <div class="panel"><small>${gap?'UNDERREPORTED REVENUE':'REVENUE DIFFERENCE'}</small><div class="number ${gap?'bad':''}">${money(gap)}</div><p>Expected <b>${money(runs.healthy.revenue)}</b> &nbsp; · &nbsp; Reported <b>${money(run.revenue)}</b></p></div>
 <div class="grid"><article class="panel"><h2>Revenue lineage</h2><p>Cleaned orders → Daily revenue → Executive dashboard</p><small>${incident?'Completed orders removed during cleaning reduced the dashboard total.':state==='recovered'?'Recovery verified. Revenue matches the original healthy run.':'Revenue reconciles with the healthy reference run.'}</small></article>
 <article class="panel"><h2>Missing orders</h2><p>${run.missing.toLocaleString()} valid orders missing after cleaning</p>${run.orders.length?'<table><tr><th>Order ID</th><th>Amount</th></tr>'+run.orders.map(row=>'<tr><td>'+row.order_id+'</td><td>'+money(row.order_amount)+'</td></tr>').join('')+'</table>':''}</article></div>`
}
document.getElementById('action').onclick=()=>{state=state==='incident'?'recovered':'incident';render()};render()
</script></body></html>
