<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DataSentry | Interactive scenario simulator</title>
<meta name="description" content="Explore DataSentry, an interactive data quality demo that detects silent order loss, traces revenue errors and verifies recovery.">
<link rel="canonical" href="https://codewithraghavv.github.io/datasentry-demo/simulator.html">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fb;color:#242439;font:16px/1.55 system-ui,sans-serif}header,main{max-width:1040px;margin:auto;padding:1.3rem clamp(1rem,4vw,3rem)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9dcea}a{color:#4939ac}small{color:#565172;font-weight:650}h1{font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.07em;line-height:1;margin:.6rem 0}button{font:inherit;background:#4e40b7;color:white;padding:.7rem 1.1rem;border:0;border-radius:9px;cursor:pointer;font-weight:600}button:focus-visible,a:focus-visible{outline:3px solid #269779;outline-offset:3px}.panel{background:white;border:1px solid #dfe0ec;border-radius:16px;padding:1.25rem 1.5rem;margin-top:1rem}.number{font-weight:720;font-size:clamp(2.5rem,6vw,4.4rem);line-height:1.2;letter-spacing:-.06em}.bad{color:#a32740}.good{color:#146348}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}h2,h3,p{margin:.35rem 0 .8rem}h2{font-size:1.2rem}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eee;padding:.3rem}footer{padding:1.5rem 0}#action{margin:.65rem 0}.status{font-weight:650}@media(max-width:650px){.grid{grid-template-columns:1fr;gap:0}}
</style><style>
label{display:grid;gap:.35rem;font-weight:650}select,input{font:inherit;padding:.55rem .7rem;border:1px solid #bcc0d1;border-radius:7px;background:white;color:inherit;max-width:100%}.controls{display:flex;gap:1rem;flex-wrap:wrap;align-items:end}summary{cursor:pointer;font-weight:700}.scroll{overflow:auto;max-height:28rem}td,th{white-space:nowrap}button.secondary{background:#efedf9;color:#44388e}.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}details p{margin-top:.7rem}
</style></head><body><header><strong>◈ &nbsp; DataSentry</strong><a href="./">Guided demo</a></header><main><small>DATA QUALITY / SCENARIO WORKSPACE</small><h1>Pipeline simulator</h1><p>Configure a fault, run the audit, and inspect its effect on synthetic orders.</p>
<form class="panel" id="controls"><div class="controls"><label>Scenario<select id="scenario"><option value="healthy">Healthy baseline</option><option value="drop">Silent order loss</option><option value="value">Currency multiplier drift</option><option value="duplicate">Duplicate orders</option><option value="stale">Stale timestamps</option></select></label><label>Order count<select id="size"></select></label><label id="parameter"><span id="parameterLabel"></span><select id="amount"></select></label></div>
<div class="actions"><button id="run" disabled>Run pipeline and audit</button><button type="button" id="restore" class="secondary" hidden>Restore same input</button></div></form>
<p id="status" role="status">Loading synthetic orders…</p><div id="results" hidden>
<section class="panel"><small id="gapLabel"></small><div id="gap" class="number"></div><p id="comparison"></p></section>
<div class="grid"><section class="panel"><h2>Audit and root cause</h2><p id="finding"></p><p id="evidence"></p></section><section class="panel"><h2>Downstream impact</h2><p id="path"></p><p id="remedy"></p></section></div>
<details class="panel" open><summary>Stage telemetry</summary><div class="scroll" id="stages"></div></details>
<section class="panel"><h2>Dataset inspector</h2><label>Pipeline output<select id="dataset"><option value="ingestion">Ingested orders</option><option value="cleaning">Cleaned orders</option><option value="daily">Daily revenue</option><option value="customers">Customer features</option></select></label><p id="count"></p><div class="scroll" id="preview"></div></section></div></main><script src="simulator.js" defer></script></body></html>
